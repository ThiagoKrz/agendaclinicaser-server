<mat-card>
  <h2>Cadastrar Usuário</h2>
  <form [formGroup]="formCadastro" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="outline">
      <mat-label>Nome</mat-label>
      <input matInput formControlName="nome" required />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Sobrenome</mat-label>
      <input matInput formControlName="sobrenome" required />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" type="email" required />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Data de Nascimento</mat-label>
      <input matInput formControlName="dataNascimento" type="date" required />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Telefone</mat-label>
      <input matInput formControlName="telefone" required />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Nome do Supervisor</mat-label>
      <input matInput formControlName="nomeSupervisor" required />
    </mat-form-field>

    <div class="actions">
      <button mat-raised-button color="primary" type="submit">Cadastrar</button>
      <button mat-raised-button color="warn" type="button" (click)="cancelar()">Cancelar</button>
    </div>
  </form>
</mat-card>
